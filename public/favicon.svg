<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- Background tile — ink-dark, slightly rounded so it doesn't fight
       browser favicon clipping. -->
  <rect width="64" height="64" rx="10" fill="#221E18"/>

  <!-- The Map — a ring with 8 dots and one amber "you" dot. Scaled
       up from the MullMark component (32 viewBox → 64 viewBox).
       Inverted color: cream on dark for favicon contrast. -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#F8EDC8" stroke-width="2.2"/>

  <!-- Eight position dots, irregular spacing to feel hand-placed. -->
  <circle cx="32" cy="11" r="2.0" fill="#F8EDC8"/>
  <circle cx="46" cy="16" r="2.0" fill="#F8EDC8"/>
  <circle cx="51" cy="32" r="2.0" fill="#F8EDC8"/>
  <circle cx="44" cy="46" r="2.0" fill="#F8EDC8"/>
  <circle cx="30" cy="50" r="2.0" fill="#F8EDC8"/>
  <circle cx="16" cy="46" r="2.0" fill="#F8EDC8"/>
  <circle cx="11" cy="32" r="2.0" fill="#F8EDC8"/>
  <circle cx="17" cy="16" r="2.0" fill="#F8EDC8"/>

  <!-- "You" dot — larger, in amber, offset inward. -->
  <circle cx="38" cy="24" r="4.2" fill="#F1C76A"/>
  <circle cx="38" cy="24" r="4.2" fill="none" stroke="#221E18" stroke-width="0.6"/>
</svg>
